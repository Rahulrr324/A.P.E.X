name: APEX Local Alpha Checks

# T-30 (2026-11-19): supersedes the earlier path-filtered trigger. Every push to main now
# runs the source/client syntax guard and full APEX test suite, including repository-wide edits.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apex-app-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node.js test suite
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Node.js version
        run: node --version
      - name: Install development dependencies only
        working-directory: apex_app
        run: npm ci --ignore-scripts
      - name: Check source files and extracted UI client
        working-directory: apex_app
        run: npm run test:syntax
      - name: Run the full APEX test suite
        working-directory: apex_app
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/apex-test.log"
      # T-30 S4 (2026-11-19): a red run's log lives behind a download this environment cannot
      # reach, so the failing test names are echoed as one annotation, which the checks API can be
      # read back without fetching the log.
      - name: Report failing tests
        if: failure()
        run: |
          log="$RUNNER_TEMP/apex-test.log"
          summary="no test log was written"
          if [ -f "$log" ]; then
            summary="$(grep -E '^[[:space:]]*not ok [0-9]+' "$log" | head -30 | sed 's/^[[:space:]]*//' | paste -sd ' | ' -)"
            [ -n "$summary" ] || summary="the suite failed without a 'not ok' line"
          fi
          summary="${summary//$'\n'/ }"
          echo "::error title=apex-test-failures::${summary:0:30000}"
          # The assertion text is what identifies the cause, so it is flattened into a second
          # annotation next to the names above.
          details=""
          if [ -f "$log" ]; then
            details="$(grep -E '^[[:space:]]*not ok [0-9]+|error:|Expected|actual:|expected:|stack:' "$log" | head -120 | sed 's/^[[:space:]]*//' | paste -sd ' ~ ' -)"
          fi
          details="${details//$'\n'/ }"
          echo "::error title=apex-test-details::${details:0:30000}"
